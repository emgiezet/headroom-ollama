name: Release

# Push a tag `vX.Y.Z` matching `project.version` to publish to PyPI.
# Requires a PyPI trusted publisher for this repo/workflow/environment
# (https://docs.pypi.org/trusted-publishers/): no API token is stored here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches project version
        run: |
          version=$(uv version --short)
          test "v${version}" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} != pyproject version ${version}"; exit 1; }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
