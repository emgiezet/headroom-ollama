[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "headroom-ollama"
version = "0.1.1"
description = "Headroom proxy extension: compress Ollama traffic under its own /ollama route"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Max Małecki", email = "maxmalecki@gmail.com" }]
requires-python = ">=3.10"
# Pinned to the minor line the contract tests run against: the extension relies on
# Headroom internals (x-headroom-base-url, x-client classification, the 0.36.5
# upstream_guard SSRF allowlist) beyond the stable install(app, config) signature.
dependencies = [
    "headroom-ai[proxy]>=0.36.5,<0.37",
    "httpx>=0.27",
    "click>=8",
]

[project.entry-points."headroom.proxy_extension"]
ollama = "headroom_ollama.proxy:install"

[project.entry-points."headroom.cli_extension"]
ollama = "headroom_ollama.cli:register"

[dependency-groups]
dev = ["pytest>=8", "uvicorn>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["src/headroom_ollama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
